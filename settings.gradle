// 与官方 MDK（forge-1.20.1-47.4.26-mdk.zip）保持一致。
// 差异：pluginManagement 里多了 Sponge 仓库 —— MixinGradle（org.spongepowered.mixin）发布在那里。
pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
        maven {
            name = 'Sponge'
            url = 'https://repo.spongepowered.org/repository/maven-public/'
        }
    }
}

plugins {
    // MDK 靠这个解析器在 toolchain 缺失时自动下载 JDK 17。
    // 本机不依赖它联网：gradle.properties 里的 org.gradle.java.installations.paths
    // 指向已便携解包的 JDK 17（本机 IPv6/证书链不稳，见 tools/README.md）。
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.7.0'
}

rootProject.name = 'net_music_can_play_bili'
