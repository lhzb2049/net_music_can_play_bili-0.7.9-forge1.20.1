# ===== 与官方 MDK（forge-1.20.1-47.4.26-mdk.zip）对齐的部分 =====
# MDK 默认 -Xmx3G（MC 反编译需要）。后面三个 -D 都是本机实测出来的必需项：
#  * preferIPv4Stack：本机 IPv6 出网不可用，Java 默认先试 IPv6 会卡到超时
#    （实测 services.gradle.org 20s 超时 → 强制 IPv4 后 1.6s）。
#  * sun.net.client.default*Timeout：**关键**。ForgeGradle 的下载（commons-io 的
#    FileUtils.copyURLToFile 等）没设超时，而 Java 的 HttpURLConnection 默认**无限等待** ——
#    实测构建会停在这类半关闭连接上永久挂住（daemon 空闲、70 个 CloseWait + 1 个卡住的
#    Established 到 Forge maven，日志停住 15 分钟以上）。设了超时后它会失败/重试而不是挂死。
#  * net.minecraftforge.gradle.check.certs=false：**每次配置阶段** ForgeGradle 都会
#    EnvironmentChecks.testServerConnection() 去连 Forge maven 与 Mojang maven 验证书
#    （见 EnvironmentChecks.checkEnvironment ← UserDevPlugin.apply）。这条检查不受 --offline 约束，
#    在慢速滴流网络上会永久挂在 TLS 握手上（jstack 判据：readHandshakeRecord）。
#    它只是"连通性/证书"的便利检查，关掉不影响构建正确性。
org.gradle.jvmargs=-Xmx3G -Djava.net.preferIPv4Stack=true -Dsun.net.client.defaultConnectTimeout=30000 -Dsun.net.client.defaultReadTimeout=60000 -Dnet.minecraftforge.gradle.check.certs=false

# Gradle 自己的 HTTP 客户端（依赖下载）也设超时
systemProp.org.gradle.internal.http.connectionTimeout=30000
systemProp.org.gradle.internal.http.socketTimeout=60000

# 本机没有系统级 JDK 17，用便携解包的那份（msiexec /a 展开，不注册、不改 PATH）。
# 这样 MDK 的 java.toolchain.languageVersion = 17 能就地解析，不必让 foojay 联网下载。
# 路径用正斜杠：.properties 里反斜杠是转义字符。

