# Access Transformer（1.20.1 / Forge）
# 第 91 次：这里开始有实际条目。**名字必须用 SRG**（f_/m_ 形式），官方名只能写在 # 后面当注释 ——
# 依据：Forge 自己的 build\_atJar_N\parent_at.cfg 就是 `default net.minecraft.client.KeyMapping f_90817_ # isDown`，
# 而本项目里 AT 这一步跑在 SRG->official 重映射**之前**（日志里紧跟其后才是 "Creating SRG -> MCP TSRG"），
# 所以 AT 看到的字段名就是 SRG 名。第一版用官方名写了 6 条 —— 解析器不报错，但也**什么都没改**。
# 为什么需要它们：这几个 render-state 常量在 1.20.1 是 protected，我们的包引用不到。
# 原来用「同包借道」解决（在 net/minecraft/client/renderer/ 下放一个类暴露它们），
# 但「把 class 放进游戏自己的包」在 Forge 上行不通：ModLauncher 把每个 mod 做成 JPMS 自动模块，
# 而 minecraft 模块导出了 net.minecraft.client.renderer，我们的 jar 又包含同一个包，
# 模块解析直接拒绝（java.lang.module.ResolutionException ... module minecraft exports package ...），
# 异常只打到 javaw 丢掉的 stderr 上 —— 表现是「日志戛然而止、没有 crash-report、没有 hs_err、进程悄悄消失」。
# 注意：本文件里不可以出现「只有 # 的行」（空注释行）。AT 解析器会把那一行当非法规则，
#       直接 IllegalArgumentException: Invalid AccessTransformer config。注释必须是「# + 内容」。
public net.minecraft.client.renderer.RenderStateShard f_110139_ # TRANSLUCENT_TRANSPARENCY
public net.minecraft.client.renderer.RenderStateShard f_173095_ # RENDERTYPE_LINES_SHADER
public net.minecraft.client.renderer.RenderStateShard f_110110_ # NO_CULL
public net.minecraft.client.renderer.RenderStateShard f_110115_ # COLOR_WRITE
public net.minecraft.client.renderer.RenderStateShard f_110114_ # COLOR_DEPTH_WRITE
public net.minecraft.client.renderer.RenderStateShard f_110119_ # VIEW_OFFSET_Z_LAYERING
# LineStateShard 的 class 文件是 public、构造器也是 public，但它是 RenderStateShard 的**嵌套类**，
# InnerClasses 属性里写着 protected ⇒ javac 只认那个 ⇒ 别的包 new 不了它（这就是当初要"借道"的原因）。
# AT 放宽嵌套类（Forge 的 parent_at.cfg 里就有 `public net.minecraft.client.Options$FieldAccess`）。
public net.minecraft.client.renderer.RenderStateShard$LineStateShard
