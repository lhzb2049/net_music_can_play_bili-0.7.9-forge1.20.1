description='''Adds Bilibili video audio support to NetMusic.

把 B 站视频链接（BV/av）写进音乐 CD 即可播放其音频；广播喇叭里输入 live:直播间ID 播放直播音频；
另有视频投影仪、歌词投影仪、中控台、MP4/Pad 手持播放器等方块与物品。

本包是上述模组的 **Forge 1.20.1 非官方移植**（基线取自 NeoForge 1.21.1 分支）。'''

